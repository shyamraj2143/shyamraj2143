<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc"><title id="title">Shyam Raj — Animated Developer Profile</title><desc id="desc">Animated 3D-style futuristic developer profile banner.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".38" stop-color="#11105b"/><stop offset=".72" stop-color="#6d0f86"/><stop offset="1" stop-color="#006b91"/></linearGradient><linearGradient id="neon"><stop stop-color="#5ff7ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient><radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".12" stop-color="#7af7ff"/><stop offset=".46" stop-color="#7857ff"/><stop offset="1" stop-color="#100a45"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern></defs><rect width="1280" height="460" rx="30" fill="url(#bg)"/><rect width="1280" height="460" rx="30" fill="url(#grid)"/><circle cx="1050" cy="215" r="220" fill="#5ff4ff" opacity=".07"><animate attributeName="r" values="190;235;190" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".04;.14;.04" dur="4s" repeatCount="indefinite"/></circle><path d="M0 405C220 330 430 465 680 390S1040 335 1280 385V460H0Z" fill="#02030c" opacity=".35"/><g font-family="Segoe UI,Arial,sans-serif" fill="#fff"><g><rect x="62" y="34" width="212" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/><circle cx="84" cy="52" r="5" fill="#5ff7ff" filter="url(#glow)"><animate attributeName="r" values="4;9;4" dur="1.5s" repeatCount="indefinite"/></circle><text x="101" y="58" font-size="12" font-weight="800" letter-spacing="2">SHYA