<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".38" stop-color="#11164d"/><stop offset=".7" stop-color="#32105f"/><stop offset="1" stop-color="#005d78"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#55f7ff"/><stop offset=".5" stop-color="#8c63ff"/><stop offset="1" stop-color="#ff4fc9"/></linearGradient>
 <linearGradient id="name"><stop stop-color="#55f7ff"/><stop offset=".45" stop-color="#a16cff"/><stop offset="1" stop-color="#ff59d2"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".12" stop-color="#62f7ff"/><stop offset=".45" stop-color="#6355ff"/><stop offset="1" stop-color="#090b35"/></radialGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <!-- Every line is revealed left-to-right, stays visible briefly, then disappears and repeats. -->
 <clipPath id="t1"><rect x="54" y="25" width="0" height="30"><animate attributeName="width" values="0;235;235;0" keyTimes="0;.11;.52;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t2"><rect x="54" y="72" width="0" height="78"><animate attributeName="width" values="0;480;480;0" keyTimes="0;.12;.52;1" dur="12s" begin=".45s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t3"><rect x="56" y="158" width="0" height="35"><animate attributeName="width" values="0;510;510;0" keyTimes="0;.11;.52;1" dur="12s" begin="1.15s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t4"><rect x="56" y="198" width="0" height="30"><animate attributeName="width" values="0;550;550;0" keyTimes="0;.12;.52;1" dur="12s" begin="1.9s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t5"><rect x="56" y="235" width="0" height="30"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.12;.52;1" dur="12s" begin="2.65s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t6"><rect x="56" y="278" width="0" height="30"><animate attributeName="width" values="0;175;175;0" keyTimes="0;.1;.52;1" dur="12s" begin="3.4s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t7"><rect x="250" y="278" width="0" height="30"><animate attributeName="width" values="0;185;185;0" keyTimes="0;.1;.52;1" dur="12s" begin="3.85s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t8"><rect x="454" y="278" width="0" height="30"><animate attributeName="width" values="0;205;205;0" keyTimes="0;.1;.52;1" dur="12s" begin="4.3s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t9"><rect x="56" y="332" width="0" height="28"><animate attributeName="width" values="0;590;590;0" keyTimes="0;.12;.52;1" dur="12s" begin="5.05s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="t10"><rect x="56" y="367" width="0" height="28"><animate attributeName="width" values="0;500;500;0" keyTimes="0;.11;.52;1" dur="12s" begin="5.75s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="r1"><rect x="770" y="58" width="0" height="28"><animate attributeName="width" values="0;160;160;0" keyTimes="0;.1;.52;1" dur="12s" begin="6.5s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="r2"><rect x="770" y="95" width="0" height="26"><animate attributeName="width" values="0;190;190;0" keyTimes="0;.1;.52;1" dur="12s" begin="7s" repeatCount="indefinite"/></rect></clipPath>
 <clipPath id="r3"><rect x="770" y="130" width="0" height="26"><animate attributeName="width" values="0;180;180;0" keyTimes="0;.1;.52;1" dur="12s" begin="7.5s" repeatCount="indefinite"/></clipPath>
</defs>

<rect width="1280" height="460" rx="30" fill="url(#bg)"/>
<rect width="1280" height="460" rx="30" fill="url(#grid)"/>
<path d="M0 420C250 350 420 450 690 380S1060 330 1280 390V460H0Z" fill="#020617" opacity=".35"/>

<!-- Left: clean developer command panel -->
<rect x="35" y="28" width="650" height="400" rx="28" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".13"/>
<circle cx="62" cy="57" r="5" fill="#55f7ff"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="77" y="62" fill="#9eabc9" font-size="11" font-family="Segoe UI,Arial" font-weight="800" letter-spacing="2">DEVELOPER_PROFILE / ONLINE</text>

<g font-family="Segoe UI,Arial,sans-serif">
 <!-- Each text object is clipped by an animated typing window. -->
 <g clip-path="url(#t1)"><text x="56" y="48" fill="url(#name)" font-size="16" font-weight="900" letter-spacing="4">✦ SHYAM RAJ ✦</text></g>
 <g clip-path="url(#t2)"><text x="56" y="135" fill="url(#name)" font-size="70" font-weight="900" letter-spacing="1">SHYAM RAJ</text></g>
 <g clip-path="url(#t3)"><text x="58" y="184" fill="#fff" font-size="21" font-weight="850">AI APPLICATION · FULL-STACK · REALTIME</text></g>
 <g clip-path="url(#t4)"><text x="58" y="219" fill="#cbd5ef" font-size="15">B.Tech CSE student building practical, production-minded software.</text></g>
 <g clip-path="url(#t5)"><text x="58" y="257" fill="#8fa0c8" font-size="12" letter-spacing="1.5">PYTHON · FASTAPI · REACT · TYPESCRIPT · WEBRTC · NODE · REDIS</text></g>

 <!-- Chips themselves type in one after another -->
 <g clip-path="url(#t6)"><rect x="56" y="270" width="175" height="45" rx="14" fill="#55f7ff" fill-opacity=".07" stroke="#55f7ff" stroke-opacity=".55"/><text x="143" y="298" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">PYTHON + AI</text></g>
 <g clip-path="url(#t7)"><rect x="250" y="270" width="185" height="45" rx="14" fill="#8c63ff" fill-opacity=".08" stroke="#8c63ff" stroke-opacity=".55"/><text x="342" y="298" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">FULL-STACK</text></g>
 <g clip-path="url(#t8)"><rect x="454" y="270" width="205" height="45" rx="14" fill="#ff4fc9" fill-opacity=".08" stroke="#ff4fc9" stroke-opacity=".55"/><text x="556" y="298" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">REALTIME + MOBILE</text></g>

 <g clip-path="url(#t9)"><text x="58" y="350" fill="#aeb9d8" font-size="12" letter-spacing="1.35">AI · BACKEND · FRONTEND · ANDROID · CLOUD · SYSTEM DESIGN</text></g>
 <g clip-path="url(#t10)"><text x="58" y="385" fill="#55f7ff" font-size="13" font-weight="900">BUILDING → LEARNING → SHIPPING → IMPROVING</text></g>

 <!-- typing cursors -->
 <g fill="#55f7ff">
  <rect x="54" y="25" width="3" height="25"><animate attributeName="x" values="54;290;54" keyTimes="0;.11;1" dur="12s" repeatCount="indefinite"/></rect>
  <rect x="54" y="73" width="5" height="65"><animate attributeName="x" values="54;535;54" keyTimes="0;.12;1" dur="12s" begin=".45s" repeatCount="indefinite"/></rect>
  <rect x="56" y="160" width="3" height="25"><animate attributeName="x" values="56;570;56" keyTimes="0;.11;1" dur="12s" begin="1.15s" repeatCount="indefinite"/></rect>
 </g>
</g>

<!-- Right: 3D AI core / recruiter signal board -->
<rect x="710" y="28" width="535" height="400" rx="28" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".13"/>
<circle cx="1035" cy="230" r="190" fill="#55f7ff" opacity=".055"><animate attributeName="r" values="170;205;170" dur="4s" repeatCount="indefinite"/></circle>
<g fill="none">
 <circle cx="1035" cy="230" r="145" stroke="#55f7ff" stroke-opacity=".3" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 1035 230" to="360 1035 230" dur="8s" repeatCount="indefinite"/></circle>
 <circle cx="1035" cy="230" r="180" stroke="#ff4fc9" stroke-opacity=".2" stroke-width="2" stroke-dasharray="8 14"><animateTransform attributeName="transform" type="rotate" from="360 1035 230" to="0 1035 230" dur="12s" repeatCount="indefinite"/></circle>
</g>
<circle cx="1035" cy="230" r="96" fill="url(#core)" filter="url(#glow)"><animate attributeName="r" values="90;104;92;101;90" dur="3.8s" repeatCount="indefinite"/></circle>
<circle cx="1005" cy="198" r="24" fill="#fff" opacity=".35"><animate attributeName="cx" values="995;1018;995" dur="3s" repeatCount="indefinite"/></circle>

<!-- Right-side text also types repeatedly -->
<g font-family="Segoe UI,Arial,sans-serif">
 <g clip-path="url(#r1)"><text x="772" y="78" fill="#78f8ff" font-size="11" font-weight="900" letter-spacing="2">AI SYSTEMS</text></g>
 <g clip-path="url(#r2)"><text x="772" y="113" fill="#e5e9f7" font-size="13" font-weight="800">BUILD · TEST · SHIP</text></g>
 <g clip-path="url(#r3)"><text x="772" y="148" fill="#aeb9d8" font-size="12">PRODUCT + SYSTEM DESIGN</text></g>
 <path d="M770 173l44-28 40 16 48-39 55 24" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 230"><animate attributeName="stroke-dashoffset" from="0" to="-250" dur="2.5s" repeatCount="indefinite"/></path>
</g>

<!-- Bottom status -->
<g font-family="Segoe UI,Arial,sans-serif">
 <rect x="770" y="365" width="390" height="38" rx="19" fill="#fff" fill-opacity=".06" stroke="#55f7ff" stroke-opacity=".22"/>
 <circle cx="793" cy="384" r="5" fill="#55f7ff"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></circle>
 <text x="807" y="389" fill="#dce5f7" font-size="11" font-weight="800" letter-spacing="1.2">OPEN TO INTERNSHIPS · COLLABORATION</text>
</g>
