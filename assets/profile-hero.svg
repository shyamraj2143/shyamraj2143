<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">Shyam Raj — Advanced Developer Profile</title><desc id="desc">Animated futuristic developer profile hero for Shyam Raj.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".38" stop-color="#11105b"/><stop offset=".72" stop-color="#6d0f86"/><stop offset="1" stop-color="#006b91"/></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop stop-color="#5ff7ff"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".12" stop-color="#7af7ff"/><stop offset=".46" stop-color="#7857ff"/><stop offset="1" stop-color="#100a45"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<style>
.fade{animation:fade 1.2s ease-out both}.delay1{animation-delay:.25s}.delay2{animation-delay:.5s}.delay3{animation-delay:.75s}
.float1{animation:float1 5s ease-in-out infinite}.float2{animation:float2 6s ease-in-out infinite}.float3{animation:float3 5.5s ease-in-out infinite}
.pulse{animation:pulse 2.8s ease-in-out infinite}.spin{transform-origin:1040px 215px;animation:spin 18s linear infinite}.dash{animation:dash 4s linear infinite}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes float1{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-12px) rotate(-4deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(14px) rotate(9deg)}}
@keyframes float3{0%,100%{transform:translateY(0) rotate(4deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-80}}
</style>
</defs>
<rect width="1280" height="460" rx="30" fill="url(#bg)"/>
<rect width="1280" height="460" rx="30" fill="url(#grid)"/>
<circle cx="1050" cy="215" r="220" fill="#5ff4ff" opacity=".07" class="pulse"/>
<circle cx="160" cy="450" r="190" fill="#ff4fd8" opacity=".08"/>
<path d="M0 405C220 330 430 465 680 390S1040 335 1280 385V460H0Z" fill="#02030c" opacity=".35"/>

<g font-family="Segoe UI,Arial,sans-serif" fill="#fff">
  <g class="fade">
    <rect x="62" y="34" width="212" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
    <circle cx="84" cy="52" r="5" fill="#5ff7ff" filter="url(#glow)"/>
    <text x="101" y="58" font-size="12" font-weight="800" letter-spacing="2">SHYAM RAJ · DEVELOPER</text>
  </g>

  <g class="fade delay1">
    <text x="62" y="135" font-size="68" font-weight="900" letter-spacing="1">SHYAM RAJ</text>
    <rect x="64" y="154" width="450" height="6" rx="3" fill="url(#neon)"/>
    <text x="64" y="197" font-size="23" font-weight="800" fill="#eef0ff">AI APPLICATION · FULL-STACK · REALTIME</text>
    <text x="64" y="229" font-size="16" fill="#c0c9e7">B.Tech CSE student building practical, production-minded software.</text>
  </g>

  <g class="fade delay2">
    <g transform="translate(64 266)">
      <rect width="150" height="44" rx="14" fill="#fff" fill-opacity=".08" stroke="#5ff7ff" stroke-opacity=".55"/>
      <text x="75" y="28" text-anchor="middle" font-size="12" font-weight="800">PYTHON + AI</text>
      <rect x="164" width="164" height="44" rx="14" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".55"/>
      <text x="246" y="28" text-anchor="middle" font-size="12" font-weight="800">FULL-STACK</text>
      <rect x="342" width="180" height="44" rx="14" fill="#fff" fill-opacity=".08" stroke="#ff4fd8" stroke-opacity=".55"/>
      <text x="432" y="28" text-anchor="middle" font-size="12" font-weight="800">REALTIME + MOBILE</text>
    </g>
    <text x="64" y="350" font-size="12" fill="#a7b3d4" letter-spacing="1.5">FASTAPI · REACT · TYPESCRIPT · WEBRTC · NODE · REDIS · DOCKER</text>
    <text x="64" y="382" font-size="13" fill="#6ff7ff" font-weight="700">BUILDING → LEARNING → SHIPPING → IMPROVING</text>
  </g>

  <g class="spin" fill="none">
    <circle cx="1040" cy="215" r="145" stroke="#6ff7ff" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="1040" cy="215" r="178" stroke="#ff63db" stroke-opacity=".22" stroke-width="2" stroke-dasharray="8 13" class="dash"/>
  </g>
  <circle cx="1040" cy="215" r="94" fill="url(#orb)" filter="url(#glow)" class="pulse"/>
  <circle cx="1010" cy="183" r="25" fill="#fff" opacity=".38"/>

  <g class="float1 delay1">
    <rect x="745" y="76" width="190" height="88" rx="20" fill="#fff" fill-opacity=".08" stroke="#62f6ff" stroke-opacity=".48"/>
    <text x="768" y="108" fill="#8ff8ff" font-size="11" font-weight="900">AI SYSTEMS</text>
    <path d="M768 139l33-20 29 12 34-29 40 18" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="float2 delay2">
    <rect x="1000" y="310" width="214" height="96" rx="20" fill="#fff" fill-opacity=".08" stroke="#ff63db" stroke-opacity=".48"/>
    <text x="1024" y="346" fill="#fff" font-size="12" font-weight="900">BUILD → TEST → SHIP</text>
    <rect x="1024" y="365" width="135" height="9" rx="4.5" fill="url(#neon)"/>
    <text x="1024" y="393" fill="#b9c6e8" font-size="10">PRODUCT ENGINEERING</text>
  </g>
  <g class="float3 delay3">
    <rect x="700" y="290" width="218" height="94" rx="20" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".48"/>
    <circle cx="730" cy="321" r="8" fill="#62f6ff"/><circle cx="756" cy="321" r="8" fill="#8b5cf6"/><circle cx="782" cy="321" r="8" fill="#ff4fd8"/>
    <text x="724" y="355" fill="#dce2f4" font-size="12" font-weight="800">PRODUCT + SYSTEM DESIGN</text>
  </g>
</g>
</svg>