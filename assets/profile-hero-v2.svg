<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Shyam Raj — Animated Developer Profile</title>
<desc id="desc">Animated futuristic GitHub profile hero with Shyam Raj branding, glowing name transitions, orbital AI core and floating cards.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".38" stop-color="#17105f"/><stop offset=".72" stop-color="#71118e"/><stop offset="1" stop-color="#007c9c"/></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop stop-color="#5ff7ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#6ff7ff"/><stop offset=".7" stop-color="#a678ff"/><stop offset="1" stop-color="#ff68da"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".1" stop-color="#7af7ff"/><stop offset=".43" stop-color="#7857ff"/><stop offset="1" stop-color="#100a45"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<style>
.fade{animation:fade 1.1s ease-out both}.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}
.floatA{animation:floatA 4.8s ease-in-out infinite}.floatB{animation:floatB 5.4s ease-in-out infinite}.floatC{animation:floatC 5s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}.spin{transform-origin:1040px 235px;animation:spin 15s linear infinite}.dash{animation:dash 3s linear infinite}
.nameGlow{animation:nameGlow 2.8s ease-in-out infinite}.nameReveal{animation:nameReveal 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes nameReveal{from{opacity:0;transform:translateY(25px) scale(.92);letter-spacing:14px}to{opacity:1;transform:translateY(0) scale(1);letter-spacing:1px}}
@keyframes nameGlow{0%,100%{filter:drop-shadow(0 0 3px #5ff7ff)}50%{filter:drop-shadow(0 0 16px #ff4fd8)}}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-13px) rotate(-3deg)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(14px) rotate(9deg)}}
@keyframes floatC{0%,100%{transform:translateY(0) rotate(4deg)}50%{transform:translateY(-10px) rotate(0deg)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-90}}
</style>
</defs>
<rect width="1280" height="480" rx="30" fill="url(#bg)"/><rect width="1280" height="480" rx="30" fill="url(#grid)"/>
<circle cx="1040" cy="235" r="230" fill="#5ff4ff" opacity=".08" class="pulse"/><circle cx="150" cy="470" r="190" fill="#ff4fd8" opacity=".08"/>
<path d="M0 425C220 345 430 470 680 405S1040 350 1280 395V480H0Z" fill="#02030c" opacity=".35"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#fff">
<!-- animated name ABOVE the main title -->
<g class="nameReveal nameGlow">
<text x="64" y="53" font-size="18" font-weight="900" letter-spacing="5" fill="url(#name)">✦ SHYAM RAJ ✦</text>
<rect x="64" y="64" width="174" height="3" rx="1.5" fill="url(#neon)" opacity=".9"><animate attributeName="width" values="40;174;110;174" dur="2.4s" repeatCount="indefinite"/></rect>
</g>
<g class="fade d1">
<rect x="64" y="84" width="212" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
<circle cx="86" cy="101" r="5" fill="#5ff7ff" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="103" y="106" font-size="11" font-weight="800" letter-spacing="1.7">DEVELOPER PROFILE</text>
</g>
<g class="nameReveal d1 nameGlow">
<text x="64" y="180" font-size="68" font-weight="900" letter-spacing="1" fill="url(#name)">SHYAM RAJ</text>
<rect x="64" y="198" width="450" height="6" rx="3" fill="url(#neon)"><animate attributeName="width" values="0;450;450" dur="1.8s" begin=".7s" fill="freeze"/></rect>
</g>
<g class="fade d2">
<text x="64" y="241" font-size="22" font-weight="800" fill="#eef0ff">AI APPLICATION · FULL-STACK · REALTIME</text>
<text x="64" y="272" font-size="16" fill="#c0c9e7">B.Tech CSE student building practical, production-minded software.</text>
<g transform="translate(64 306)">
<rect width="150" height="44" rx="14" fill="#fff" fill-opacity=".08" stroke="#5ff7ff" stroke-opacity=".55"/><text x="75" y="28" text-anchor="middle" font-size="12" font-weight="800">PYTHON + AI</text>
<rect x="164" width="164" height="44" rx="14" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".55"/><text x="246" y="28" text-anchor="middle" font-size="12" font-weight="800">FULL-STACK</text>
<rect x="342" width="180" height="44" rx="14" fill="#fff" fill-opacity=".08" stroke="#ff4fd8" stroke-opacity=".55"/><text x="432" y="28" text-anchor="middle" font-size="12" font-weight="800">REALTIME + MOBILE</text>
</g>
<text x="64" y="386" font-size="12" fill="#a7b3d4" letter-spacing="1.5">FASTAPI · REACT · TYPESCRIPT · WEBRTC · NODE · REDIS · DOCKER</text>
<text x="64" y="416" font-size="13" fill="#6ff7ff" font-weight="700">BUILDING → LEARNING → SHIPPING → IMPROVING</text>
</g>
<g class="spin" fill="none"><circle cx="1040" cy="235" r="148" stroke="#6ff7ff" stroke-opacity=".3" stroke-width="2"/><circle cx="1040" cy="235" r="184" stroke="#ff63db" stroke-opacity=".24" stroke-width="2" stroke-dasharray="8 13" class="dash"/></g>
<circle cx="1040" cy="235" r="95" fill="url(#orb)" filter="url(#glow)" class="pulse"/>
<circle cx="1010" cy="202" r="25" fill="#fff" opacity=".4"/>
<g class="floatA d1"><rect x="750" y="74" width="190" height="88" rx="20" fill="#fff" fill-opacity=".08" stroke="#62f6ff" stroke-opacity=".5"/><text x="774" y="106" fill="#8ff8ff" font-size="11" font-weight="900">AI SYSTEMS</text><path d="M774 137l33-20 29 12 34-29 40 18" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round"/></g>
<g class="floatB d2"><rect x="1000" y="330" width="214" height="96" rx="20" fill="#fff" fill-opacity=".08" stroke="#ff63db" stroke-opacity=".5"/><text x="1024" y="366" fill="#fff" font-size="12" font-weight="900">BUILD → TEST → SHIP</text><rect x="1024" y="385" width="135" height="9" rx="4.5" fill="url(#neon)"><animate attributeName="width" values="25;135;75;135" dur="3s" repeatCount="indefinite"/></rect><text x="1024" y="412" fill="#b9c6e8" font-size="10">PRODUCT ENGINEERING</text></g>
<g class="floatC d3"><rect x="700" y="318" width="218" height="94" rx="20" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".5"/><circle cx="730" cy="349" r="8" fill="#62f6ff"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="756" cy="349" r="8" fill="#8b5cf6"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" begin=".3s" repeatCount="indefinite"/></circle><circle cx="782" cy="349" r="8" fill="#ff4fd8"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" begin=".6s" repeatCount="indefinite"/></circle><text x="724" y="383" fill="#dce2f4" font-size="12" font-weight="800">PRODUCT + SYSTEM DESIGN</text></g>
</g></svg>